<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sage – Study Coach</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --text:#1c1e21; --user:#2f6fed; --bot:#eceef2; --err:#fdecec; --errt:#b3261e; }
  @media (prefers-color-scheme: dark) { :root { --bg:#16181d; --card:#1f2229; --text:#e8eaed; --user:#3b7bff; --bot:#2b2f38; --err:#3a1f1f; --errt:#ff8a80; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: system-ui, sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; justify-content:center; }
  main { width:100%; max-width:720px; display:flex; flex-direction:column; height:100%; background:var(--card); }
  header { padding:14px 18px; display:flex; justify-content:space-between; align-items:center; border-bottom:1px solid var(--bot); }
  header h1 { font-size:18px; margin:0; }
  #log { flex:1; overflow-y:auto; padding:18px; display:flex; flex-direction:column; gap:10px; }
  .msg { max-width:80%; padding:10px 14px; border-radius:14px; white-space:pre-wrap; line-height:1.45; }
  .user { align-self:flex-end; background:var(--user); color:#fff; }
  .bot { align-self:flex-start; background:var(--bot); }
  .error { align-self:flex-start; background:var(--err); color:var(--errt); }
  form { display:flex; gap:8px; padding:14px; border-top:1px solid var(--bot); }
  input { flex:1; padding:11px 14px; border-radius:10px; border:1px solid var(--bot); background:var(--bg); color:var(--text); font-size:15px; }
  button { padding:10px 16px; border:0; border-radius:10px; background:var(--user); color:#fff; font-size:15px; cursor:pointer; }
  button.ghost { background:transparent; color:var(--text); border:1px solid var(--bot); }
  button:disabled { opacity:.5; cursor:not-allowed; }
</style>
</head>
<body>
<main>
  <header><h1>🧭 Sage — your study coach</h1><button class="ghost" id="new">New chat</button></header>
  <div id="log"></div>
  <form id="form"><input id="input" placeholder="Ask me anything about learning to code…" autocomplete="off" maxlength="4000" autofocus><button id="send">Send</button></form>
</main>
<script>
const log = document.getElementById('log'), form = document.getElementById('form'),
      input = document.getElementById('input'), send = document.getElementById('send');
let cid = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random();
 
function add(text, cls) {
  const d = document.createElement('div');
  d.className = 'msg ' + cls; d.textContent = text;
  log.appendChild(d); log.scrollTop = log.scrollHeight; return d;
}
function greet() { add("Hi, I'm Sage! Tell me your name and what you're trying to learn.", 'bot'); }
greet();
 
form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = input.value.trim(); if (!message) return;
  add(message, 'user'); input.value = ''; send.disabled = true;
  const typing = add('Thinking…', 'bot');
  try {
    const res = await fetch('/api/chat', { method:'POST', headers:{'Content-Type':'application/json'},
                                           body: JSON.stringify({ conversation_id: cid, message }) });
    const data = await res.json().catch(() => ({}));
    typing.remove();
    if (!res.ok) add('⚠️ ' + (data.error || 'Unexpected server error. Please try again.'), 'error');
    else add(data.reply, 'bot');
  } catch (err) {
    typing.remove(); add('⚠️ Could not reach the server. Check your connection and try again.', 'error');
  } finally { send.disabled = false; input.focus(); }
});
 
document.getElementById('new').addEventListener('click', async () => {
  await fetch('/api/reset', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ conversation_id: cid }) }).catch(()=>{});
  cid = crypto.randomUUID ? crypto.randomUUID() : String(Date.now()); log.innerHTML = ''; greet();
});
</script>
</body>
</html>
